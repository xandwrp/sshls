[package]
name = "sshls"
version = "0.0.2"
edition = "2024"
rust-version = "1.85"
description = "A small, durable inventory for SSH destinations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xandwrp/sshls"
readme = "README.md"
keywords = ["ssh", "openssh", "cli", "inventory"]
categories = ["command-line-utilities", "config"]
publish = ["crates-io"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "src/**",
    "tests/**",
]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
fs4 = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
toml = "1.1.4"
wait-timeout = "0.2.1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
