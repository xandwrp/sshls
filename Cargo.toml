[package]
name = "sshls"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A small, durable inventory for SSH destinations"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
fs4 = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
toml = "1.1.4"
wait-timeout = "0.2.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
