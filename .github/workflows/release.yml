name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      rust_version: ${{ steps.metadata.outputs.rust_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate tag and manifest
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          rust_version="$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"

          if [[ -z "${version}" || -z "${rust_version}" ]]; then
            echo "Could not read version or rust-version from Cargo.toml" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "rust_version=${rust_version}" >> "${GITHUB_OUTPUT}"

      - name: Install Rust
        run: >-
          rustup toolchain install "${{ steps.metadata.outputs.rust_version }}"
          --profile minimal
          --component clippy,rustfmt
          --no-self-update

      - name: Check formatting
        run: rustup run "${{ steps.metadata.outputs.rust_version }}" cargo fmt --all -- --check

      - name: Run Clippy
        run: >-
          rustup run "${{ steps.metadata.outputs.rust_version }}"
          cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: >-
          rustup run "${{ steps.metadata.outputs.rust_version }}"
          cargo test --all-targets --all-features --locked

      - name: Verify crates.io package
        run: >-
          rustup run "${{ steps.metadata.outputs.rust_version }}"
          cargo publish --dry-run --locked

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Install Rust
        run: >-
          rustup toolchain install "${{ needs.validate.outputs.rust_version }}"
          --profile minimal
          --target "${{ matrix.target }}"
          --no-self-update

      - name: Build binary
        run: >-
          rustup run "${{ needs.validate.outputs.rust_version }}"
          cargo build --release --locked --target "${{ matrix.target }}"

      - name: Smoke-test Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: ./target/${{ matrix.target }}/release/sshls --version

      - name: Smoke-test Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "target\${{ matrix.target }}\release\sshls.exe" --version'

      - name: Package Linux archive
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          base="sshls-v${VERSION}-${TARGET}"
          mkdir -p "dist/${base}"
          cp "target/${TARGET}/release/sshls" "dist/${base}/sshls"
          cp README.md LICENSE-APACHE LICENSE-MIT "dist/${base}/"
          tar -C dist -czf "dist/${base}.tar.gz" "${base}"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          $base = "sshls-v$env:VERSION-$env:TARGET"
          $bundle = Join-Path "dist" $base
          New-Item -ItemType Directory -Path $bundle | Out-Null
          Copy-Item "target\$env:TARGET\release\sshls.exe" (Join-Path $bundle "sshls.exe")
          Copy-Item README.md, LICENSE-APACHE, LICENSE-MIT $bundle
          Compress-Archive -Path $bundle -DestinationPath "dist\$base.zip"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  publish-crate:
    name: Publish to crates.io
    needs: [validate, build]
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: >-
          rustup toolchain install "${{ needs.validate.outputs.rust_version }}"
          --profile minimal
          --no-self-update

      - name: Build package
        run: >-
          rustup run "${{ needs.validate.outputs.rust_version }}"
          cargo package --locked

      - name: Check whether this version is already published
        id: crate
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          response="$(mktemp)"
          status="$(curl --silent --show-error --output "${response}" --write-out '%{http_code}' --retry 3 \
            --user-agent "sshls-release/${VERSION} (+https://github.com/xandwrp/sshls)" \
            "https://crates.io/api/v1/crates/sshls/${VERSION}")"

          case "${status}" in
            200)
              echo "sshls ${VERSION} is already published"
              echo "published=true" >> "${GITHUB_OUTPUT}"
              ;;
            404)
              echo "published=false" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "crates.io returned HTTP ${status}" >&2
              cat "${response}" >&2
              exit 1
              ;;
          esac

      - name: Authenticate with crates.io
        if: steps.crate.outputs.published != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crate
        if: steps.crate.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: >-
          rustup run "${{ needs.validate.outputs.rust_version }}"
          cargo publish --locked

  github-release:
    name: Publish GitHub release
    needs: [validate, build, publish-crate]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "sshls ${VERSION}" \
              --generate-notes
          fi

          gh release upload "${GITHUB_REF_NAME}" \
            release-assets/*.tar.gz \
            release-assets/*.zip \
            release-assets/SHA256SUMS \
            --clobber
